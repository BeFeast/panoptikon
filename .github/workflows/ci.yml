name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust:
    name: Rust Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # rust-embed requires web/.next/static/ to exist at compile time
      - name: Setup Bun (for rust-embed assets)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend assets (required by rust-embed)
        working-directory: web
        run: bun install && bun run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --release --all-targets

      - name: Test
        run: cargo test --all-targets

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx eslint src --ext .ts,.tsx --max-warnings=0 || true

      - name: Build
        run: bun run build

  e2e-check:
    name: E2E Test Coverage Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for E2E test changes or justification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get list of changed files in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Check if any source files changed (not just docs/config)
          HAS_SRC_CHANGES=false
          for f in $CHANGED; do
            case "$f" in
              server/src/*|web/src/*) HAS_SRC_CHANGES=true; break ;;
            esac
          done

          if [ "$HAS_SRC_CHANGES" = "false" ]; then
            echo "No source changes detected — E2E test not required"
            exit 0
          fi

          # Check if E2E tests were added or modified
          HAS_E2E=false
          for f in $CHANGED; do
            case "$f" in
              web/tests/e2e/*|web/e2e/*) HAS_E2E=true; break ;;
            esac
          done

          if [ "$HAS_E2E" = "true" ]; then
            echo "E2E test changes detected — check passed"
            exit 0
          fi

          # Check PR body for justification
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json body -q .body 2>/dev/null || echo "")
          if echo "$PR_BODY" | grep -qi "why no e2e test"; then
            echo "PR contains 'Why no E2E test' justification — check passed"
            exit 0
          fi

          echo "::error::This PR changes source code but does not include E2E tests."
          echo "::error::Either add Playwright tests in web/tests/e2e/ or add a '## Why no E2E test' section to the PR description."
          exit 1

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend assets
        working-directory: web
        run: bun install && bun run build

      - name: Build server binary
        run: cargo build --release

      - name: Start server
        run: |
          ./target/release/panoptikon-server &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/login > /dev/null 2>&1; then
              echo "Server is up after ${i}s!"
              exit 0
            fi
            # Check if server process is still running
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died unexpectedly"
              exit 1
            fi
            sleep 1
          done
          echo "Server failed to respond within 30 seconds"
          exit 1

      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: web
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
