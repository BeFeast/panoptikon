name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust:
    name: Rust Build & Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # rust-embed requires web/.next/static/ to exist at compile time
      - name: Setup Bun (for rust-embed assets)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend assets (required by rust-embed)
        working-directory: web
        run: bun install && bun run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --release --all-targets

      - name: Start Caddy for integration tests
        run: |
          docker run -d --name caddy-test -p 2019:2019 caddy:2-alpine
          for i in $(seq 1 30); do
            if curl -sf http://localhost:2019/config/ > /dev/null 2>&1; then
              echo "Caddy admin API ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:2019/config/ || (echo "Caddy failed to start within 30s" && exit 1)

      - name: Test
        run: cargo test --all-targets

      - name: Write deploy metadata
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          cat > deploy-metadata.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "version": "$VERSION",
            "branch": "main",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_id": "${{ github.run_id }}"
          }
          EOF
          cat deploy-metadata.json

      - name: Upload deploy artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-server-amd64
          path: |
            target/release/panoptikon-server
            deploy-metadata.json
          retention-days: 30

  frontend:
    name: Frontend Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx eslint src --ext .ts,.tsx --max-warnings=0 || true

      - name: Build
        run: bun run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend assets
        working-directory: web
        run: bun install && bun run build

      - name: Build server binary
        run: cargo build --release

      - name: Start server
        run: |
          ./target/release/panoptikon-server &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/login > /dev/null 2>&1; then
              echo "Server is up after ${i}s!"
              exit 0
            fi
            # Check if server process is still running
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died unexpectedly"
              exit 1
            fi
            sleep 1
          done
          echo "Server failed to respond within 30 seconds"
          exit 1

      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: web
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
