name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust:
    name: Rust Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # rust-embed requires web/.next/static/ to exist at compile time
      - name: Setup Bun (for rust-embed assets)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend assets (required by rust-embed)
        working-directory: web
        run: bun install && bun run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --release --all-targets

      - name: Test
        run: cargo test --all-targets

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx eslint src --ext .ts,.tsx --max-warnings=0 || true

      - name: Build
        run: bun run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend assets
        working-directory: web
        run: bun install && bun run build

      - name: Build server binary
        run: cargo build --release

      - name: Start server
        run: |
          ./target/release/panoptikon &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/login > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: web
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
